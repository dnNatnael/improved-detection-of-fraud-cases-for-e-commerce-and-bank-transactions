name: CI - Fraud Detection

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 5️⃣ Verify project imports (basic sanity check)
      - name: Check imports
        run: |
          python -c "import src"
          python -c "import notebooks"

      # 6️⃣ Run unit tests (if tests exist)
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests
          else
            echo "No tests directory found"
          fi
